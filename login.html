<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="hoalogin.css">
</head>
<body>
    <div class="auth-container">
        <div class="auth-left">
            <div class="heading">Welcome back!</div>
            <div class="subheading">Enter your Credentials to access your account</div>
        <div class="form">
            <div class="form-email">
                    <div class="form-label">Email address</div>
                    <input type="email" placeholder="Enter your email">
                </div>
                <div class="form-password">
                    <div class="form-label">Password</div>
                    <input type="password" placeholder="Enter your password">
                </div>
                <div class="form-remember">
                    <input type="checkbox" id="remember">
                    <label for="remember">Remember for 30 days</label>
                </div>
                <div class="form-button">
                    <button>Login</button>
                </div>
            </div>
            <div class="form-or">
                <div class="form-or-line"></div>
                <div class="form-or-text">Or</div>
                <div class="form-or-line"></div>
            </div>
            <div class ="form-social">
                <div class="form-icons-container">
                    <div class ="form-icons">
                        <div class="form-icon">
                            <img src="images/icon_google.svg" alt="">
                        </div>
                        <div class="form-icon-text">Sign in with Google</div>
                    </div>
                    <div class ="form-icons">
                        <div class="form-icon">
                            <img src="images/icon_apple.svg" alt="">
                        </div>
                        <div class="form-icon-text">Sign in with Apple</div>
                    </div>
                </div>
                <div class ="form-signin">
                    <div>Don’t have an account?</div>
                    <a href="index.html" class="form-signup-link">Sign Up</a>
                </div>
            </div>
         </div>
        <div class="auth-right">
            <img src="images/background_auth.png" alt="logo" width="100">
        </div>

    </div>
</body>
</html>
